<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Japflix</title>

  <link href="css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-dark text-white">
  <main>
    <div class="text-center container">
      <div class="row py-lg-3">
        <div class="col-lg-6 col-md-8 mx-auto">
          <h1 class="fw-light"><img src="img/japflix.png" alt="Japflix" /></h1>
          <input type="search" class="form-control" name="buscar" id="inputBuscar" placeholder="Ej.: The Lion King" />
          <button class="btn btn-primary m-2" id="btnBuscar">Buscar</button>
        </div>
      </div>
    </div>

    <div class="album">
      <ul class="list-group container" id="lista"></ul>
    </div>
  </main>

  <div class="offcanvas offcanvas-top bg-dark text-white" tabindex="-1" id="offcanvasDetalle" aria-labelledby="offcanvasLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="offcanvasLabel">Título</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body">
      <p id="detalle-overview"></p>
      <p><strong>Géneros:</strong> <span id="detalle-genres"></span></p>

<button class="btn btn-outline-light mt-3" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDetalle" aria-expanded="false" aria-controls="collapseDetalle">
  Más detalles
</button>

<div class="collapse mt-3" id="collapseDetalle">
  <ul class="list-group list-group-flush text-white">
    <li class="list-group-item bg-dark"><strong>Año de lanzamiento:</strong> <span id="detalle-anio"></span></li>
    <li class="list-group-item bg-dark"><strong>Duración:</strong> <span id="detalle-duracion"></span> minutos</li>
    <li class="list-group-item bg-dark"><strong>Presupuesto:</strong> $<span id="detalle-presupuesto"></span></li>
    <li class="list-group-item bg-dark"><strong>Ganancias:</strong> $<span id="detalle-ganancias"></span></li>
    <li class="list-group-item bg-dark"><strong>Calificación:</strong> <span id="detalle-calificacion"></span>
</li>
  </ul>
</div>
</div>

<footer class="text-muted py-3">
  <div class="container">
    <p class="float-end mb-1"><a href="#">Volver arriba</a></p>
    <p class="mb-1">Este sitio forma parte de <a href="https://jovenesaprogramar.edu.uy/" target="_blank">Jóvenes a Programar</a>.</p>
    <p class="mb-1">Generado con fines estrictamente educativos.</p>
  </div>
</footer>

  <script src="js/bootstrap.bundle.min.js"></script>

  <script>
    let moviesData = [];

    // Cargar datos al iniciar la página
    window.addEventListener("DOMContentLoaded", () => {
      fetch("https://japceibal.github.io/japflix_api/movies-data.json")
        .then((response) => response.json())
        .then((data) => {
          moviesData = data;
          console.log("Películas cargadas:", moviesData.length);
        })
        .catch((error) => {
          console.error("Error al cargar películas:", error);
        });
    });

    // Función para convertir voto a estrellas
    function convertirEstrellas(voto) {
      const estrellasLlenas = Math.round(voto / 2);
      const estrellasVacias = 5 - estrellasLlenas;
      return "★".repeat(estrellasLlenas) + "☆".repeat(estrellasVacias);
    }

    // Función para buscar películas por título, tagline, géneros o descripción
    function buscarPeliculas() {
      const textoBusqueda = document.getElementById("inputBuscar").value.toLowerCase();
      const lista = document.getElementById("lista");
      lista.innerHTML = "";

      if (!textoBusqueda) {
        lista.innerHTML = "<li class='list-group-item bg-dark text-white'>Ingresa un término de búsqueda.</li>";
        return;
      }

      const resultados = moviesData.filter((pelicula) =>
        pelicula.title?.toLowerCase().includes(textoBusqueda) ||
        pelicula.tagline?.toLowerCase().includes(textoBusqueda) ||
        pelicula.genres.join(", ").toLowerCase().includes(textoBusqueda) ||
        pelicula.overview?.toLowerCase().includes(textoBusqueda)
      );

      if (resultados.length === 0) {
        lista.innerHTML = "<li class='list-group-item bg-dark text-white'>No se encontraron películas.</li>";
        return;
      }

      resultados.forEach((pelicula) => {
        const item = document.createElement("li");
        item.classList.add("list-group-item", "bg-dark", "text-white", "border-secondary");
        item.style.cursor = "pointer";

 item.innerHTML = `
          <h5>${pelicula.title}</h5>
          <p><em>${pelicula.tagline || "Sin tagline"}</em></p>
          <p>${convertirEstrellas(pelicula.vote_average)}</p>
        `;

        // Evento para mostrar detalles al hacer clic
        item.addEventListener("click", () => {
          mostrarDetalle(pelicula);
        });

        lista.appendChild(item);
      });
    }

    // Mostrar detalles en el offcanvas
    function mostrarDetalle(pelicula) {
      document.getElementById("offcanvasLabel").innerText = pelicula.title;
      document.getElementById("detalle-overview").innerText = pelicula.overview || "No existe una descripción disponible.";
      document.getElementById("detalle-genres").innerText = pelicula.genres
      ? pelicula.genres.map(g => g.name).join(", ")
      : "No hay géneros disponibles";

      // Mostrar detalles
      const anio = pelicula.release_date ? pelicula.release_date.slice(0, 4) : "Desconocido";
      document.getElementById("detalle-anio").innerText = anio; // Año de lanzamiento
      document.getElementById("detalle-duracion").innerText = pelicula.runtime || "Desconocido"; // Duración
      document.getElementById("detalle-presupuesto").innerText = pelicula.budget ? pelicula.budget.toLocaleString() : "No disponible"; // Presupuesto
      document.getElementById("detalle-ganancias").innerText = pelicula.revenue ? pelicula.revenue.toLocaleString() : "No disponible"; // Ganancias

      // Mostrar offcanvas
      const offcanvas = new bootstrap.Offcanvas(document.getElementById("offcanvasDetalle"));
      offcanvas.show();
    }

    document.getElementById("btnBuscar").addEventListener("click", buscarPeliculas);
  </script>
</body>

</html>
